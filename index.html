<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Traductor de subtítulos</title>
  <meta name="description" content="Traduce subtítulos .srt y .vtt con IA (Claude, Gemini, GPT, DeepSeek o un modelo local). Gratis, en tu navegador y con tu propia clave.">
  <meta name="theme-color" content="#b84d1b">
  <meta property="og:title" content="Traductor de subtítulos · Subtitle Translator">
  <meta property="og:description" content="Traduce subtítulos .srt y .vtt con IA, en tu navegador y con tu propia clave. · Translate .srt and .vtt subtitles with AI, in your browser, with your own key.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23b84d1b'/><rect x='12' y='34' width='40' height='6' rx='3' fill='white'/><rect x='18' y='44' width='28' height='6' rx='3' fill='white' opacity='.75'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"></span>
    <h1><span data-i="app.title">Traductor de subtítulos</span> <span id="ver" class="ver"></span></h1>
  </div>
  <nav class="topnav">
    <select id="uiLang" class="uilang" data-i-aria="app.uiLang">
      <option value="es">ES</option>
      <option value="en">EN</option>
    </select>
    <button class="btn ghost" id="openHelp" data-i="nav.help"></button>
    <button class="btn ghost" id="openKeys" data-i="nav.keys"></button>
  </nav>
</header>

<main>
  <!-- Bienvenida (solo en la primera visita) -->
  <section class="card welcome" id="welcome" hidden>
    <button class="icon close" id="welcomeClose" data-i-aria="welcome.close">✕</button>
    <h2 data-i="welcome.title"></h2>
    <ol class="steps">
      <li><span data-i="welcome.step1"></span>
        <button class="btn sm primary" id="welcomeKeys" data-i="welcome.addKey"></button></li>
      <li data-i="welcome.step2"></li>
      <li data-i="welcome.step3"></li>
    </ol>
    <p class="muted small" data-i="welcome.free"></p>
  </section>

  <!-- 1. Archivo -->
  <section class="card" id="stepFile">
    <h2><span class="n">1</span> <span data-i="file.title"></span></h2>
    <div id="restore" class="banner" hidden></div>
    <div id="drop" class="drop" tabindex="0" role="button" data-i-aria="file.dropAria">
      <strong data-i="file.dropTitle"></strong>
      <span data-i="file.dropSub"></span>
      <input type="file" id="file" accept=".srt,.vtt,.json,.wrk" hidden>
    </div>
    <p id="fileInfo" class="fileinfo" hidden></p>
    <div id="speakerBox" class="speaker" hidden></div>
  </section>

  <!-- 2. Ajustes -->
  <section class="card" id="stepSettings">
    <h2><span class="n">2</span> <span data-i="settings.title"></span></h2>

    <div class="row langs">
      <label><span data-i="settings.src"></span>
        <select id="src"></select>
      </label>
      <span class="arrow">→</span>
      <label><span data-i="settings.tgt"></span>
        <select id="tgt"></select>
      </label>
      <div class="chips" id="tgtChips" role="group" data-i-aria="settings.recent" hidden>
        <span class="muted small" data-i="settings.recent"></span>
        <span id="chipList"></span>
      </div>
    </div>

    <div class="row">
      <label><span data-i="settings.engine"></span>
        <select id="provider"></select>
      </label>
      <label class="grow"><span data-i="settings.model"></span>
        <span class="inline">
          <select id="model"></select>
          <button class="icon" id="reloadModels" data-i-title="settings.reload" data-i-aria="settings.reload">↻</button>
        </span>
      </label>
      <label class="check small"><input type="checkbox" id="showAll"> <span data-i="settings.showAll"></span></label>
    </div>
    <p id="keyWarn" class="warn" hidden></p>

    <div class="row">
      <label class="grow"><span data-i="settings.fidelity"></span> <b id="tempVal">0,5</b>
        <input type="range" id="temp" min="0" max="1" step="0.1" value="0.5">
        <span class="scale"><span data-i="settings.literal"></span><span data-i="settings.free"></span></span>
        <small id="tempNote" class="muted"></small>
      </label>
    </div>

    <details class="ctx" id="ctxBox">
      <summary><b data-i="ctx.title"></b> <span class="muted small" id="ctxSummary"></span></summary>
      <div class="row two">
      <label><span><span data-i="ctx.notes"></span> <small class="muted" data-i="ctx.notesHint"></small></span>
        <textarea id="notes" rows="4" data-i-ph="ctx.notesPh"></textarea>
      </label>
      <label><span><span data-i="ctx.gloss"></span> <small class="muted" data-i="ctx.glossHint"></small></span>
        <textarea id="glossary" rows="4" data-i-ph="ctx.glossPh"></textarea>
        <button type="button" class="link" id="sampleGloss" data-i="ctx.sample"></button>
      </label>
    </div>

    </details>

    <details class="adv">
      <summary data-i="adv.title"></summary>
      <div class="row">
        <label><span data-i="adv.batch"></span>
          <select id="batch">
            <option value="20">20</option>
            <option value="40" selected id="batchRec">40</option>
            <option value="60">60</option>
            <option value="100">100</option>
          </select>
        </label>
        <label><span data-i="adv.conc"></span>
          <select id="conc">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </label>
        <label><span data-i="adv.chars"></span>
          <input type="number" id="maxChars" min="10" max="80" placeholder="42">
        </label>
        <label class="check"><input type="checkbox" id="fullCtx" checked>
          <span><span data-i="adv.full"></span><br><small class="muted" data-i="adv.fullHint"></small></span>
        </label>
      </div>
    </details>
  </section>

  <!-- 3. Traducir -->
  <section class="card sticky" id="stepRun">
    <div class="runbar">
      <button class="btn primary" id="start" disabled data-i="run.translate"></button>
      <button class="btn" id="stop" hidden data-i="run.pause"></button>
      <button class="btn warnbtn" id="retryErrors" hidden data-i="run.retry"></button>
      <div class="progress">
        <div class="track"><div class="bar" id="bar"></div></div>
        <div class="ptext"><span id="progressText"></span> <span id="estimate" class="muted"></span></div>
        <div id="stats" class="muted small"></div>
      </div>
      <div class="resets">
        <button class="btn sm ghost" id="clearTrans" disabled data-i-title="run.clearTitle" data-i="run.clear"></button>
        <button class="btn sm ghost danger" id="resetAll" disabled data-i-title="run.resetTitle" data-i="run.reset"></button>
      </div>
    </div>
  </section>

  <!-- 4. Tabla -->
  <section class="card" id="stepTable">
    <div class="tablehead">
      <h2><span class="n">3</span> <span data-i="table.title"></span></h2>
      <select id="filter">
        <option value="all" data-i="table.all"></option>
        <option value="pending" data-i="table.pending"></option>
        <option value="error" data-i="table.error"></option>
      </select>
    </div>
    <div class="findbar" id="findBar">
      <input type="search" id="findText" data-i-ph="find.ph" data-i-aria="find.aria">
      <input type="text" id="replText" data-i-ph="find.replPh" data-i-aria="find.replPh">
      <label class="check small"><input type="checkbox" id="findCase"> <span data-i="find.case"></span></label>
      <label class="check small"><input type="checkbox" id="findWord" checked> <span data-i="find.word"></span></label>
      <button class="btn sm" id="replBtn" disabled data-i="find.repl"></button>
      <span id="findCount" class="muted small" aria-live="polite"></span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr><th>#</th><th data-i="table.orig"></th><th data-i="table.trans"></th><th></th></tr></thead>
        <tbody id="rows"><tr><td colspan="4" class="muted center" data-i="table.empty"></td></tr></tbody>
      </table>
    </div>
    <div class="exportbar" id="exportBar">
      <button class="btn primary" data-exp="srt" disabled data-i="exp.srt"></button>
      <button class="btn" data-exp="vtt" disabled>.vtt</button>
      <button class="btn" data-exp="bi" disabled data-i-title="exp.biTitle" data-i="exp.bi"></button>
      <button class="btn" data-exp="orig" disabled data-i-title="exp.origTitle" data-i="exp.orig"></button>
      <span class="spacer"></span>
      <button class="btn ghost" data-exp="project" disabled data-i-title="exp.projectTitle" data-i="exp.project"></button>
    </div>
  </section>
</main>

<footer>
  <p data-i="footer.privacy"></p>
  <p data-i="footer.based"></p>
</footer>

<dialog id="helpDlg">
  <div class="help">
    <h2 data-i="help.title"></h2>
    <h3 data-i="help.whatH"></h3>
    <p data-i="help.whatP"></p>
    <h3 data-i="help.costH"></h3>
    <p data-i="help.costP"></p>
    <h3 data-i="help.modelH"></h3>
    <ul data-i="help.modelList"></ul>
    <h3 data-i="help.privH"></h3>
    <p data-i="help.privP"></p>
    <h3 data-i="help.tipsH"></h3>
    <ul data-i="help.tipsList"></ul>
    <div class="actions"><button class="btn primary" id="helpClose" data-i="help.ok"></button></div>
  </div>
</dialog>

<dialog id="keysDlg">
  <form method="dialog" class="keys">
    <h2 data-i="keys.title"></h2>
    <p class="muted" data-i="keys.intro"></p>
    <label>Claude (Anthropic) <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener" data-i="keys.get"></a>
      <span class="inline"><input type="password" id="kAnthropic" placeholder="sk-ant-…" autocomplete="off"><button type="button" class="icon" data-eye="kAnthropic" data-i-aria="keys.show">👁</button></span>
    </label>
    <label>OpenRouter <a href="https://openrouter.ai/keys" target="_blank" rel="noopener" data-i="keys.get"></a>
      <span class="inline"><input type="password" id="kOpenrouter" placeholder="sk-or-…" autocomplete="off"><button type="button" class="icon" data-eye="kOpenrouter" data-i-aria="keys.show">👁</button></span>
    </label>
    <label>OpenAI <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener" data-i="keys.get"></a>
      <span class="inline"><input type="password" id="kOpenai" placeholder="sk-…" autocomplete="off"><button type="button" class="icon" data-eye="kOpenai" data-i-aria="keys.show">👁</button></span>
    </label>
    <label><span data-i="keys.lm"></span>
      <input type="text" id="kLm" placeholder="http://127.0.0.1:1234">
      <small class="muted" data-i="keys.lmHint"></small>
    </label>
    <label class="check"><input type="checkbox" id="kRemember" checked> <span data-i="keys.remember"></span></label>
    <div class="actions">
      <button class="btn ghost" id="keysCancel" data-i="keys.cancel"></button>
      <button class="btn primary" id="keysSave" data-i="keys.save"></button>
    </div>
  </form>
</dialog>

<div id="toasts" aria-live="polite"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
